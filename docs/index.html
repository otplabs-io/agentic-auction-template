:root{
  --paper:#F2F4F5;
  --surface:#FFFFFF;
  --ink:#14181C;
  --slate:#5C6672;
  --mute:#8B95A1;
  --rule:#DDE2E6;
  --accent:#2E4A78;
  --accent-soft:#E8EDF5;

  /* One hue, three intensities. Every tier is a deal worth winning, so nothing
     here is a warning colour -- the ramp encodes degree, not good vs bad. */
  --good-bg:#D8E9D3;  --good-fg:#3F5F47;  --good-bar:#8FB795;
  --great-bg:#8FC988; --great-fg:#224E29; --great-bar:#47955A;
  --steal-bg:#14713C; --steal-fg:#FFFFFF; --steal-bar:#14713C;

  /* Wine type. Judged from the wine, not read off a column in the export --
     the export has no such field. Hue is the whole signal here, so the two
     pale swatches lean on a darker ring rather than on fill alone. */
  --wt-red:#6B1B2E;         /* burgundy  */
  --wt-white:#EFE0B0;       /* cream     */
  --wt-rose:#F2A5B6;        /* pink      */
  --wt-sparkling:#FFFFFF;   /* white     */
  --wt-dessert:#7A4A21;     /* brown     */
  --wt-orange:#E08A2E;      /* orange    */

  --pick:#B8860B;           /* gold, for the personal-pick star */

  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'IBM Plex Serif',ui-serif,Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --rail:272px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ---------- masthead ---------- */
.masthead{
  position:sticky;top:0;z-index:60;
  background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:20px;
  padding:12px 20px;
}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:4px}
.brand b{
  font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:-.01em;
}
.brand span{
  font-family:var(--mono);font-size:10.5px;color:var(--mute);
  letter-spacing:.06em;text-transform:uppercase;
}
.views{display:flex;gap:2px;background:var(--paper);padding:3px;border-radius:7px}
.views button{
  border:0;background:transparent;padding:5px 13px;border-radius:5px;
  font-size:12.5px;font-weight:500;color:var(--slate);cursor:pointer;
}
.views button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,28,.10)}
.masthead .spacer{flex:1}

.search{position:relative}
.search input{
  width:260px;padding:7px 11px 7px 30px;
  border:1px solid var(--rule);border-radius:7px;background:var(--surface);
  font:inherit;font-size:12.5px;
}
.search input::placeholder{color:var(--mute)}
.search svg{position:absolute;left:9px;top:8px;width:13px;height:13px;stroke:var(--mute);fill:none;stroke-width:2}

.ghost{
  border:1px solid var(--rule);background:var(--surface);
  padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;
}
.ghost:hover{border-color:var(--mute)}
.ghost[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#railToggle{display:none}

/* ---------- sample banner ---------- */
.sample-banner{
  background:#FFF6DA;border-bottom:1px solid #E9D89A;color:#6B5310;
  padding:8px 20px;font-size:12.5px;display:flex;gap:8px;align-items:baseline;
}
.sample-banner b{font-weight:600}
/* Author-origin display:flex above otherwise beats the UA [hidden] rule --
   JSDOM's computed-style doesn't model this cascade, so it only shows up in
   a real browser. See known-limits.md. */
.sample-banner[hidden]{display:none!important}

/* ---------- summary ---------- */
.summary{
  background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:0;padding:0 20px;
}
.metric{padding:11px 22px 12px 0;margin-right:22px;border-right:1px solid var(--rule)}
.metric:last-child{border-right:0}
.metric .k{
  font-family:var(--mono);font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mute);display:block;margin-bottom:2px;
}
.metric .v{font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:-.02em}
.metric .v small{font-size:11.5px;color:var(--mute);font-weight:400;letter-spacing:0}
.tierdots{display:flex;gap:10px;align-items:baseline}
.tierdots i{font-style:normal;font-family:var(--mono);font-size:14px;font-weight:500;display:flex;gap:5px;align-items:center}
.tierdots i::before{content:"";width:8px;height:8px;border-radius:2px;display:block}
.tierdots .g::before{background:var(--good-bar)}
.tierdots .r::before{background:var(--great-bar)}
.tierdots .s::before{background:var(--steal-bar)}

/* ---------- funnel ---------- */
.funnel{background:var(--surface);border-bottom:1px solid var(--rule)}
.funnel > summary{
  padding:8px 20px;cursor:pointer;font-size:12px;color:var(--slate);
  font-weight:500;list-style:none;display:flex;align-items:center;gap:7px;
}
.funnel > summary::-webkit-details-marker{display:none}
.funnel > summary::before{content:"▸";color:var(--mute);font-size:10px}
.funnel[open] > summary::before{content:"▾"}
.funnel-body{padding:2px 20px 16px;display:flex;flex-wrap:wrap;gap:0}
.fstep{padding-right:18px;margin-right:18px;border-right:1px solid var(--rule);min-width:88px}
.fstep:last-child{border-right:0}
.fstep .k{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:block}
.fstep .v{font-family:var(--mono);font-size:15px}
.fstep .d{font-size:11px;color:#B4342A}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:16px;padding:16px 20px 40px;align-items:start}

/* ---------- filter rail ---------- */
.rail{position:sticky;top:65px;max-height:calc(100vh - 82px);overflow-y:auto;padding-right:2px}
.rail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rail-head h2{font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0;font-weight:500}
.railCloseBtn{display:none}
.railBackdrop{display:none}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:12px;cursor:pointer;text-decoration:underline}
.linkbtn[disabled]{color:var(--mute);cursor:default;text-decoration:none}

.fgroup{background:var(--surface);border:1px solid var(--rule);border-radius:8px;margin-bottom:8px;overflow:hidden}
.fgroup > summary{
  padding:9px 11px;cursor:pointer;font-weight:600;font-size:12.5px;
  list-style:none;display:flex;align-items:center;justify-content:space-between;gap:6px;
}
.fgroup > summary::-webkit-details-marker{display:none}
.fgroup > summary .caret{color:var(--mute);font-size:9px;transition:transform .15s}
.fgroup[open] > summary .caret{transform:rotate(90deg)}
.fgroup .count{
  font-family:var(--mono);font-size:10px;background:var(--accent);color:#fff;
  border-radius:9px;padding:1px 6px;margin-left:auto;
}
.fbody{padding:2px 11px 11px}
.opt{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:12.5px}
.opt input{margin:0;accent-color:var(--accent);width:14px;height:14px;flex:none}
.opt .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .n{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:none}
.opt.off{opacity:.4}
.subtle{font-size:11.5px;color:var(--mute);padding:3px 0}
.scrolly{max-height:196px;overflow-y:auto}

/* dual range */
.range{padding:4px 2px 2px}
.range .vals{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--slate);margin-bottom:5px}
.track{position:relative;height:26px}
.track .hist{position:absolute;inset:0 0 11px 0;display:flex;align-items:flex-end;gap:1px}
.track .hist span{flex:1;background:var(--rule);border-radius:1px 1px 0 0;min-height:1px}
.track .hist span.on{background:#B9C6D8}
.track .rail-line{position:absolute;left:0;right:0;bottom:8px;height:3px;background:var(--rule);border-radius:2px}
.track .fill{position:absolute;bottom:8px;height:3px;background:var(--accent);border-radius:2px}
.track input[type=range]{
  position:absolute;left:0;right:0;bottom:0;width:100%;height:20px;margin:0;
  -webkit-appearance:none;appearance:none;background:none;pointer-events:none;
}
.track input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;pointer-events:auto;width:14px;height:14px;border-radius:50%;
  background:var(--surface);border:2px solid var(--accent);cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.track input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:11px;color:var(--mute);margin-top:5px;line-height:1.35}

/* ---------- chips ---------- */
.chips:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
  color:var(--accent);border:1px solid #C9D6E8;border-radius:20px;
  padding:3px 5px 3px 10px;font-size:11.5px;font-weight:500;
}
.chip b{font-weight:600}
.chip button{border:0;background:none;cursor:pointer;color:var(--accent);opacity:.65;font-size:13px;line-height:1;padding:0 3px}
.chip button:hover{opacity:1}

/* ---------- table ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tablewrap{overflow:auto;max-height:calc(100vh - 262px);min-height:240px;overscroll-behavior:contain}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--rule);text-align:left;
  padding:9px 10px;white-space:nowrap;font-weight:600;font-size:11px;
  letter-spacing:.03em;text-transform:uppercase;color:var(--slate);cursor:pointer;
  user-select:none;
}
thead th:hover{color:var(--ink)}
thead th .arrow{color:var(--accent);font-size:9px;margin-left:3px}
thead th[aria-sort="none"] .arrow{visibility:hidden}
tbody td{padding:7px 10px;border-bottom:1px solid #EEF1F3;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F7F9FB}

.num{font-family:var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.wine{font-family:var(--serif);font-size:13.5px;font-weight:500;min-width:250px;max-width:340px}
.wine a{text-decoration:none;color:var(--ink);border-bottom:1px solid transparent}
.wine a:hover{border-bottom-color:var(--accent);color:var(--accent)}
.wine a::after{content:"↗";font-family:var(--sans);font-size:9px;color:var(--mute);margin-left:4px;vertical-align:2px}
.cflag{font-family:'FlagEmoji',var(--sans);font-size:15px;line-height:1;cursor:default}
.cflag.fallback{font-family:var(--mono);font-size:10.5px;color:var(--slate);letter-spacing:.04em}
/* ---------- wine-type swatch ---------- */
.wt{
  display:inline-block;width:13px;height:13px;border-radius:3px;
  vertical-align:-2px;flex:none;cursor:default;
  box-shadow:inset 0 0 0 1px rgba(20,24,28,.20);
}
.wt-Red{background:var(--wt-red)}
.wt-White{background:var(--wt-white)}
.wt-Rose{background:var(--wt-rose)}
.wt-Sparkling{background:var(--wt-sparkling)}
.wt-Dessert{background:var(--wt-dessert)}
.wt-Orange{background:var(--wt-orange)}
/* cream and white read as "empty cell" against a white row without this */
.wt-White,.wt-Sparkling{box-shadow:inset 0 0 0 1px rgba(20,24,28,.42)}
.wtcell{width:22px;text-align:center}
/* in the filter rail the swatch sits ahead of the type name */
.opt .wt{margin-right:-2px}
@media (forced-colors:active){
  .wt{forced-color-adjust:none;border:1px solid CanvasText}
}

/* ---------- personal pick ---------- */
.pick{color:var(--pick);font-size:15px;line-height:1;cursor:default;vertical-align:-1px}
.pickcell{width:20px;text-align:center}
@media (forced-colors:active){
  .pick{forced-color-adjust:none}
}

.trunc{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--slate)}
.dash{color:#C3CAD1}
.soft{color:var(--mute)}

.pctcell{min-width:104px}
.pctrow{display:flex;align-items:center;gap:7px}
.pctrow .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;width:38px;text-align:right;flex:none}
.bar{flex:1;height:5px;background:#EEF1F3;border-radius:3px;overflow:hidden;min-width:34px}
.bar i{display:block;height:100%;border-radius:3px}

.tag{
  display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;
  font-weight:600;letter-spacing:.02em;
}
.tag.Good{background:var(--good-bg);color:var(--good-fg);box-shadow:inset 0 0 0 1px #BFD9B9}
.tag.Great{background:var(--great-bg);color:var(--great-fg);box-shadow:inset 0 0 0 1px #77B870}
.tag.Steal{background:var(--steal-bg);color:var(--steal-fg)}
.standout{color:var(--accent);font-size:11.5px;font-style:italic;max-width:150px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}

.tfoot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 12px;border-top:1px solid var(--rule);background:#FAFBFC;
  font-size:11.5px;color:var(--slate);
}
.empty{padding:46px 24px;text-align:center}
.empty h3{margin:0 0 6px;font-family:var(--serif);font-size:16px;font-weight:500}
.empty p{margin:0 0 14px;color:var(--slate)}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--ink);color:#fff;padding:9px 15px;border-radius:7px;font-size:12.5px;
  opacity:0;transition:transform .22s,opacity .22s;pointer-events:none;z-index:99;
}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}

.mobileSort{display:none}
.resultsBar{display:none}

@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;display:none}
  .rail.open{display:block}
  #railToggle{display:inline-block}
  .tablewrap{max-height:none}
  .search input{width:150px}
}

/* ---------- phone layout ----------
   Desktop/tablet keep the data table as-is above this point. Below 640px the
   grid can't work as a table -- there's no room for a dozen columns -- so
   rows become stacked cards instead: a compact header line (flag, type
   swatch, wine name, deal tag) followed by labelled detail rows built from
   each <td>'s data-label (see app.js buildTable()). Column order in the
   markup is unchanged; the per-column "order" rules below only re-flow the
   *visual* order via flexbox, so this stays a pure presentation layer over
   the same DOM. The masthead's Filters button is hidden here in favour of
   #railToggleMobile in .resultsBar -- a search-results-page placement,
   right above the list it filters, instead of a header button. */
@media (max-width:640px){
  body{font-size:13.5px}
  .masthead{flex-wrap:wrap;gap:10px;padding:10px 14px;row-gap:8px}
  .brand{margin-right:0}
  .views{order:3}
  .masthead .spacer{display:none}
  .search{order:4;flex:1 1 100%}
  .search input{width:100%}
  #railToggle{display:none}
  #btnCsv{padding:7px 10px}
  .funnel-body{padding:0 14px}
  .funnel-body{gap:0}
  .shell{padding:12px 14px 32px}

  /* summary metrics: never wrap to a second line -- scroll horizontally
     instead, with a trailing fade as the affordance for that gesture */
  .summary{
    flex-wrap:nowrap;overflow-x:auto;padding:0 14px;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
    mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);
  }
  .metric{padding:9px 16px 10px 0;margin-right:16px;flex:0 0 auto;white-space:nowrap;scroll-snap-align:start}

  .resultsBar{display:flex;gap:8px;margin-bottom:10px}
  #railToggleMobile{flex:none}
  .mobileSort{
    display:block;flex:1;min-width:0;
    border:1px solid var(--rule);border-radius:7px;background:var(--surface);
    padding:8px 11px;font:inherit;font-size:12.5px;color:var(--ink);
  }

  /* ---------- filter tray ----------
     Filters no longer insert inline (that pushed the whole page down). Below
     640px .rail is a fixed bottom sheet: hidden off-screen via transform so
     it can still transition, shown by adding .open (toggleRail() in app.js
     flips this the same way it always has -- only the CSS changed). A
     backdrop dims the page behind it and doubles as a tap-to-close target;
     body scroll is locked via the .no-scroll class while it's open. */
  .rail{
    display:block;position:fixed;left:0;right:0;bottom:0;top:auto;
    max-height:85vh;overflow-y:auto;
    background:var(--surface);border-radius:16px 16px 0 0;
    box-shadow:0 -12px 32px rgba(20,24,28,.22);
    z-index:70;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%);visibility:hidden;pointer-events:none;
    transition:transform .25s ease,visibility 0s linear .25s;
  }
  .rail::before{
    content:"";display:block;width:36px;height:4px;border-radius:2px;
    background:var(--rule);margin:0 auto 12px;
  }
  .rail.open{
    transform:translateY(0);visibility:visible;pointer-events:auto;
    transition:transform .25s ease;
  }
  .railCloseBtn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;margin-left:8px;border:0;background:none;
    color:var(--slate);font-size:20px;line-height:1;cursor:pointer;border-radius:6px;
  }
  .railCloseBtn:hover{background:var(--paper);color:var(--ink)}
  .railBackdrop{
    display:block;position:fixed;inset:0;background:rgba(20,24,28,.45);
    z-index:65;opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .railBackdrop.open{opacity:1;pointer-events:auto}
  body.no-scroll{overflow:hidden}

  .panel{border-radius:10px}
  .tablewrap{overflow:visible;max-height:none}
  #grid thead{display:none}
  #grid,#grid tbody{display:block;width:100%}
  #grid tbody tr{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;
    padding:10px 12px;border-bottom:1px solid var(--rule);
  }
  #grid tbody tr:last-child{border-bottom:0}
  #grid td{
    border-bottom:0;padding:3px 0;vertical-align:baseline;
  }
  /* card-header cells: sit inline, no label, fixed order */
  #grid td[data-col="pick"]{order:1}
  #grid td[data-col="country"]{order:2}
  #grid td[data-col="wine_type"]{order:3}
  #grid td[data-col="wine"]{
    order:4;flex:1 1 auto;min-width:0;max-width:none;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #grid td[data-col="tag"]{order:5;flex:none}
  /* everything else: full-width "label value" detail row, in a fixed
     reading order (most decision-relevant first) regardless of the
     underlying <td> order in the markup */
  #grid td[data-label]{
    order:20;flex:1 1 100%;display:flex;justify-content:space-between;
    align-items:center;gap:10px;padding:5px 0;border-top:1px dashed var(--rule);
  }
  #grid td[data-label]::before{
    content:attr(data-label);font-family:var(--mono);font-size:10px;
    letter-spacing:.05em;text-transform:uppercase;color:var(--mute);flex:none;
  }
  #grid td[data-col="pct_below"]{order:6}
  #grid td[data-col="buyer_price"]{order:7}
  #grid td[data-col="market"]{order:8}
  #grid td[data-col="reserve"]{order:9}
  #grid td[data-col="vintage"]{order:10}
  #grid td[data-col="format"]{order:11}
  #grid td[data-col="region"]{order:12}
  #grid td[data-col="subregion"]{order:13}
  #grid td[data-col="qty"]{order:14}
  #grid td[data-col="condition"]{order:15}
  #grid td[data-col="flag"]{order:16}
  #grid td[data-col="source"]{order:17}

  .wine{min-width:0;max-width:none;font-size:14px}
  .trunc,.standout{max-width:none;white-space:normal;overflow:visible;text-overflow:clip}
  .pctcell{min-width:0}
  .tfoot{padding:10px 14px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* facet + range definitions per view */
var FACETS = {
  country:  {label:'Country',    of:function(r){return r.country_code;}, disp:function(v){return ccName(v);}, cascade:0},
  region:   {label:'Region',     of:function(r){return lvl(r,1);},       disp:function(v){return v;},         cascade:1},
  subregion:{label:'Subregion',  of:function(r){return lvl(r,2);},       disp:function(v){return v;},         cascade:2},
  format:   {label:'Format',     of:function(r){return r.format;},       disp:function(v){return v;}},
  wtype:    {label:'Wine type',  of:function(r){return r.wine_type;},    disp:function(v){return wtLabel(v);},
             mark:function(v){return '<span class="wt wt-'+esc(v)+'" aria-hidden="true"></span>';},
             order:WT_ORDER},
  tag:      {label:'Deal tag',   of:function(r){return r.tag;},          disp:function(v){return v;}, order:['Steal','Great','Good']},
  src:      {label:'Market source', of:function(r){return r.source_type;}, disp:function(v){return SRC_LABEL[v]||v;}}
};
var RANGES = {
  pct:     {label:'% below market', of:function(r){return r.pct_below;}, fmt:function(v){return Math.round(v*100)+'%';}, step:0.01, hist:true},
  reserve: {label:'Reserve bid',    of:function(r){return r.reserve;},      fmt:usd, step:1},
  buyer:   {label:'Buyer price',    of:function(r){return r.buyer_price;},  fmt:usd, step:1},
  market:  {label:'Market price',   of:function(r){return r.market;},    fmt:usd, step:1},
  vintage: {label:'Vintage',        of:function(r){return r.vintage;},   fmt:function(v){return String(Math.round(v));}, step:1}
};
var VIEWS = {
  deals:   {rows:DEALS, cols:COLS_DEALS, facets:['country','region','subregion','wtype','format','tag','src'],
            ranges:['pct','buyer','reserve','market','vintage'], defaultSort:{col:'pct_below',dir:-1}},
  unvalued:{rows:UNVAL, cols:COLS_UNVAL, facets:['country','region','subregion','wtype','format'],
            ranges:['reserve','vintage'], defaultSort:{col:'reserve',dir:-1}}
};

/* ---------- state ---------- */
var state = {
  view:'deals', q:'',
  sel:{country:[],region:[],subregion:[],wtype:[],format:[],tag:[],src:[]},
  rng:{},               /* key -> [lo,hi] or null when untouched */
  sort:{col:'pct_below',dir:-1},
  standouts:false,
  picks:false
};
var BOUNDS = {};        /* view -> key -> [min,max] */

function computeBounds(){
  Object.keys(VIEWS).forEach(function(v){
    BOUNDS[v] = {};
    VIEWS[v].ranges.forEach(function(k){
      var vals = VIEWS[v].rows.map(RANGES[k].of).filter(function(x){return x!=null && !isNaN(x);});
      BOUNDS[v][k] = vals.length ? [Math.min.apply(null,vals),Math.max.apply(null,vals)] : [0,1];
    });
  });
}
function bound(k){ return BOUNDS[state.view][k]; }
function rngOf(k){ return state.rng[k] || bound(k).slice(); }
function rngTouched(k){
  var r = state.rng[k]; if(!r) return false;
  var b = bound(k);
  return r[0]>b[0] || r[1]<b[1];
}

/* ---------- filtering ---------- */
function matches(r, except){
  var skip = except==null ? [] : (typeof except==='string' ? [except] : except);
  except = null;
  if(state.q){
    var terms = fold(state.q).split(/\s+/).filter(Boolean);
    for(var i=0;i<terms.length;i++) if(r._search.indexOf(terms[i])<0) return false;
  }
  if(state.view==='deals'){
    if(state.standouts && !r.flag) return false;
  }
  if(state.picks && !r.personal_pick) return false;
  var cfg = VIEWS[state.view];
  for(var fi=0;fi<cfg.facets.length;fi++){
    var key = cfg.facets[fi];
    if(skip.indexOf(key)>=0) continue;
    var sel = state.sel[key];
    if(sel.length && sel.indexOf(FACETS[key].of(r))<0) return false;
  }
  for(var ri=0;ri<cfg.ranges.length;ri++){
    var rk = cfg.ranges[ri];
    if(skip.indexOf(rk)>=0) continue;
    if(!rngTouched(rk)) continue;
    var v = RANGES[rk].of(r);
    if(v==null || isNaN(v)) return false;
    var rr = rngOf(rk);
    if(v<rr[0] || v>rr[1]) return false;
  }
  return true;
}
function filtered(){ return VIEWS[state.view].rows.filter(function(r){return matches(r,null);}); }

function activeCount(){
  var n = 0, cfg = VIEWS[state.view];
  cfg.facets.forEach(function(k){ if(state.sel[k].length) n++; });
  cfg.ranges.forEach(function(k){ if(rngTouched(k)) n++; });
  if(state.q) n++;
  if(state.view==='deals' && state.standouts) n++;
  if(state.picks) n++;
  return n;
}

/* ---------- sorting ---------- */
function sorted(rows){
  var cfg = VIEWS[state.view];
  var col = cfg.cols.filter(function(c){return c.k===state.sort.col;})[0];
  if(!col) col = cfg.cols.filter(function(c){return c.k===cfg.defaultSort.col;})[0];
  var dir = state.sort.dir, get = col.get;
  return rows.slice().sort(function(a,b){
    var x = get(a), y = get(b);
    if(x==null) x = col.type==='text'?'':-Infinity;
    if(y==null) y = col.type==='text'?'':-Infinity;
    if(x<y) return -1*dir;
    if(x>y) return 1*dir;
    return (a.wine||'').localeCompare(b.wine||'');
  });
}

/* ---------- mobile sort select ----------
   The phone layout (<=640px, see template CSS) hides <thead>, so clicking a
   column header to sort isn't reachable there. This <select> drives the same
   state.sort/buildTable()/writeHash() path the desktop header click does --
   it's a second control on the same state, not a parallel implementation. */
var SORT_DIR_WORD = {
  text: {1:'A→Z', '-1':'Z→A'},
  num:  {1:'Low→High', '-1':'High→Low'},
  rank: {1:'Low→High', '-1':'High→Low'}
};
function buildMobileSort(){
  var sel = document.getElementById('mobileSort');
  if(!sel) return;
  var cfg = VIEWS[state.view];
  var opts = [];
  cfg.cols.forEach(function(c){
    if(c.sortable===false) return;
    var lbl = c.label || (c.hint ? c.hint.charAt(0).toUpperCase()+c.hint.slice(1) : c.k);
    var words = SORT_DIR_WORD[c.type] || SORT_DIR_WORD.num;
    var first = c.type==='text' ? 1 : -1;
    [first, -first].forEach(function(dir){
      opts.push('<option value="'+c.k+':'+dir+'">'+esc(lbl)+' ('+words[dir]+')</option>');
    });
  });
  sel.innerHTML = opts.join('');
  sel.value = state.sort.col+':'+state.sort.dir;
}

/* ---------- URL hash ---------- */
var HKEYS = {country:'c',region:'rg',subregion:'sr',wtype:'wt',format:'fmt',tag:'tag',src:'src'};
function writeHash(){
  var p = [];
  if(state.view!=='deals') p.push('v='+state.view);
  if(state.q) p.push('q='+encodeURIComponent(state.q));
  Object.keys(HKEYS).forEach(function(k){
    if(state.sel[k].length) p.push(HKEYS[k]+'='+state.sel[k].map(encodeURIComponent).join(','));
  });
  Object.keys(RANGES).forEach(function(k){
    if(VIEWS[state.view].ranges.indexOf(k)>=0 && rngTouched(k)){
      var r = rngOf(k); p.push(k+'='+r[0]+'~'+r[1]);
    }
  });
  var d = VIEWS[state.view].defaultSort;
  if(state.sort.col!==d.col || state.sort.dir!==d.dir) p.push('so='+state.sort.col+':'+(state.sort.dir>0?'a':'d'));
  if(state.standouts) p.push('st=1');
  if(state.picks) p.push('pp=1');
  var h = p.join('&');
  var target = h ? '#'+h : location.pathname+location.search;
  /* Chrome gives local files an opaque origin, and some builds reject
     replaceState there. Fall back to a plain fragment write, which is always
     allowed; never let a blocked history write break the render. */
  clearTimeout(writeHash._t);
  writeHash._t = setTimeout(function(){
    try{ history.replaceState(null,'',target); }
    catch(e){
      try{ if(location.hash !== (h?'#'+h:'')) location.hash = h; }catch(e2){}
    }
  },200);
}
function readHash(){
  var h = location.hash.replace(/^#/,''); if(!h) return;
  var rev = {}; Object.keys(HKEYS).forEach(function(k){ rev[HKEYS[k]] = k; });
  h.split('&').forEach(function(part){
    var i = part.indexOf('='); if(i<0) return;
    var k = part.slice(0,i), v = part.slice(i+1);
    if(k==='v' && VIEWS[v]) state.view = v;
    else if(k==='q') state.q = decodeURIComponent(v);
    else if(rev[k]) state.sel[rev[k]] = v.split(',').map(decodeURIComponent).filter(Boolean);
    else if(RANGES[k]){
      var mm = v.split('~').map(Number);
      if(mm.length===2 && !isNaN(mm[0]) && !isNaN(mm[1])) state.rng[k] = mm;
    }
    else if(k==='so'){
      var s = v.split(':'); state.sort = {col:s[0], dir:s[1]==='a'?1:-1};
    }
    else if(k==='st') state.standouts = v==='1';
    else if(k==='pp') state.picks = v==='1';
  });
}

/* ---------- rendering: rail ---------- */
/* A parent level ignores its own children when counting options, so selecting
   a region never strands you unable to switch country. */
var CHILD_IGNORE = {country:['country','region','subregion'], region:['region','subregion'], subregion:['subregion']};

function facetOptions(key){
  var f = FACETS[key];
  var pool = VIEWS[state.view].rows.filter(function(r){ return matches(r, CHILD_IGNORE[key] || key); });
  var counts = {};
  pool.forEach(function(r){ var v = f.of(r); if(v) counts[v] = (counts[v]||0)+1; });
  state.sel[key].forEach(function(v){ if(!(v in counts)) counts[v] = 0; });
  var keys = Object.keys(counts);
  if(f.order) keys.sort(function(a,b){ return f.order.indexOf(a)-f.order.indexOf(b); });
  else keys.sort(function(a,b){ return String(f.disp(a)).localeCompare(String(f.disp(b))); });
  return keys.map(function(v){ return {v:v, n:counts[v], label:f.disp(v)}; });
}

function buildRail(){
  var cfg = VIEWS[state.view], html = '';
  cfg.facets.forEach(function(key){
    var opts = facetOptions(key), sel = state.sel[key];
    if(!opts.length) return;
    var open = sel.length>0 || key==='country' || key==='tag' || key==='wtype';
    html += '<details class="fgroup"'+(open?' open':'')+' data-facet="'+key+'">'+
      '<summary><span class="caret">▶</span>'+esc(FACETS[key].label)+
      (sel.length?'<span class="count">'+sel.length+'</span>':'')+'</summary>'+
      '<div class="fbody'+(opts.length>8?' scrolly':'')+'">';
    opts.forEach(function(o){
      var on = sel.indexOf(o.v)>=0;
      var mark = FACETS[key].mark ? FACETS[key].mark(o.v) : '';
      html += '<label class="opt'+(o.n===0&&!on?' off':'')+'">'+
        '<input type="checkbox" data-facet="'+key+'" value="'+esc(o.v)+'"'+(on?' checked':'')+'>'+
        mark+'<span class="lab">'+esc(o.label)+'</span><span class="n">'+o.n+'</span></label>';
    });
    html += '</div></details>';
  });

  cfg.ranges.forEach(function(key){
    var R = RANGES[key], b = bound(key), cur = rngOf(key);
    var histHtml = '';
    if(R.hist){
      var bins = 16, counts = new Array(bins).fill(0), max = 0;
      VIEWS[state.view].rows.forEach(function(r){
        var v = R.of(r); if(v==null) return;
        var i = Math.min(bins-1, Math.floor((v-b[0])/((b[1]-b[0])||1)*bins));
        counts[i]++;
      });
      max = Math.max.apply(null,counts)||1;
      histHtml = '<div class="hist">'+counts.map(function(c,i){
        var lo = b[0]+(b[1]-b[0])*i/bins, hi = b[0]+(b[1]-b[0])*(i+1)/bins;
        var on = hi>=cur[0] && lo<=cur[1];
        return '<span class="'+(on?'on':'')+'" style="height:'+Math.max(2,Math.round(c/max*100))+'%"></span>';
      }).join('')+'</div>';
    }
    var span = (b[1]-b[0])||1;
    var fl = (cur[0]-b[0])/span*100, fr = (cur[1]-b[0])/span*100;
    html += '<details class="fgroup" open data-range="'+key+'">'+
      '<summary><span class="caret">▶</span>'+esc(R.label)+
      (rngTouched(key)?'<span class="count">on</span>':'')+'</summary>'+
      '<div class="fbody"><div class="range">'+
        '<div class="vals"><span>'+esc(R.fmt(cur[0]))+'</span><span>'+esc(R.fmt(cur[1]))+'</span></div>'+
        '<div class="track">'+histHtml+
          '<div class="rail-line"></div><div class="fill" style="left:'+fl+'%;right:'+(100-fr)+'%"></div>'+
          '<input type="range" data-range="'+key+'" data-side="lo" min="'+b[0]+'" max="'+b[1]+'" step="'+R.step+'" value="'+cur[0]+'" aria-label="'+esc(R.label)+' minimum">'+
          '<input type="range" data-range="'+key+'" data-side="hi" min="'+b[0]+'" max="'+b[1]+'" step="'+R.step+'" value="'+cur[1]+'" aria-label="'+esc(R.label)+' maximum">'+
        '</div>'+
        (key==='pct' ? '<div class="note">Floors at '+Math.round(b[0]*100)+'% — lots below the deal cutoff are not in this file.</div>' : '')+
      '</div></div></details>';
  });

  {
    var shortlistRows = VIEWS[state.view].rows;
    html += '<details class="fgroup" open><summary><span class="caret">▶</span>Shortlists</summary><div class="fbody">'+
      '<label class="opt"><input type="checkbox" id="fPicks"'+(state.picks?' checked':'')+'>'+
      '<span class="lab">Personal picks only</span><span class="n">'+shortlistRows.filter(function(r){return r.personal_pick;}).length+'</span></label>';
    if(state.view==='deals'){
      html += '<label class="opt"><input type="checkbox" id="fStandouts"'+(state.standouts?' checked':'')+'>'+
        '<span class="lab">Standouts only</span><span class="n">'+DEALS.filter(function(r){return r.flag;}).length+'</span></label>';
    }
    html += '</div></details>';
  }
  document.getElementById('railBody').innerHTML = html;
  document.getElementById('btnClear').disabled = activeCount()===0;
}

/* ---------- rendering: chips ---------- */
function buildChips(){
  var out = [], cfg = VIEWS[state.view];
  if(state.q) out.push(chip('Search','“'+state.q+'”','q',''));
  cfg.facets.forEach(function(k){
    state.sel[k].forEach(function(v){ out.push(chip(FACETS[k].label, FACETS[k].disp(v), 'facet', k+'|'+v)); });
  });
  cfg.ranges.forEach(function(k){
    if(rngTouched(k)){
      var r = rngOf(k);
      out.push(chip(RANGES[k].label, RANGES[k].fmt(r[0])+' – '+RANGES[k].fmt(r[1]), 'range', k));
    }
  });
  if(state.view==='deals' && state.standouts) out.push(chip('','Standouts only','standouts',''));
  if(state.picks) out.push(chip('','Personal picks only','picks',''));
  document.getElementById('chips').innerHTML = out.join('');
}
function chip(label,val,kind,arg){
  return '<span class="chip">'+(label?'<b>'+esc(label)+':</b> ':'')+esc(val)+
         '<button data-chip="'+kind+'" data-arg="'+esc(arg)+'" aria-label="Remove filter">×</button></span>';
}

/* ---------- rendering: table ---------- */
/* Columns in this set form the compact "card header" line on the narrow
   (phone) layout -- flag, type swatch, wine name, deal tag -- instead of
   stacking as a labelled row like everything else. Desktop ignores this
   entirely; it only feeds the mobile CSS via data-label. */
var MOBILE_HEADER_COLS = {pick:1, country:1, wine_type:1, wine:1, tag:1};
var lastRows = [];
function buildTable(){
  var cfg = VIEWS[state.view];
  var rows = sorted(filtered());
  lastRows = rows;

  document.getElementById('head').innerHTML = cfg.cols.map(function(c){
    if(c.sortable===false) return '<th style="width:26px"></th>';
    var on = state.sort.col===c.k;
    var ar = on ? (state.sort.dir>0?'ascending':'descending') : 'none';
    return '<th data-col="'+c.k+'" aria-sort="'+ar+'" title="Sort by '+esc(c.label||c.hint||c.k)+'">'+
      esc(c.label)+'<span class="arrow">'+(on&&state.sort.dir>0?'▲':'▼')+'</span></th>';
  }).join('');

  var body = document.getElementById('body');
  if(!rows.length){
    body.innerHTML = '';
    document.getElementById('emptyState').hidden = false;
    var n = activeCount();
    document.getElementById('emptyWhy').textContent =
      n ? n+' filter'+(n===1?'':'s')+' active. Remove one, or clear them all.'
        : 'This view has no lots.';
  } else {
    document.getElementById('emptyState').hidden = true;
    var html = new Array(rows.length);
    for(var i=0;i<rows.length;i++){
      var r = rows[i], tds = '';
      for(var j=0;j<cfg.cols.length;j++){
        var c = cfg.cols[j];
        var lbl = (c.label && !MOBILE_HEADER_COLS[c.k]) ? ' data-label="'+esc(c.label)+'"' : '';
        tds += '<td data-col="'+esc(c.k)+'"'+lbl+(c.cls?' class="'+c.cls+'"':'')+'>'+c.render(r)+'</td>';
      }
      html[i] = '<tr>'+tds+'</tr>';
    }
    body.innerHTML = html.join('');
  }
  buildMobileSort();

  var total = cfg.rows.length;
  document.getElementById('footCount').textContent =
    rows.length===total ? total+' lots' : rows.length+' of '+total+' lots';
  document.getElementById('footNote').textContent =
    state.view==='deals' ? ('Buyer price = reserve + '+Math.round((P.premium_rate||0)*100)+'% premium. Discount measured on buyer price; tax and shipping excluded.')
                         : 'No reliable market price found — excluded from deal ranking.';
}

/* ---------- rendering: summary ---------- */
function buildSummary(){
  var el = document.getElementById('summary');
  if(state.view!=='deals'){
    var n = filtered().length;
    el.innerHTML = metric('Unvalued lots', n+' <small>of '+UNVAL.length+'</small>')+
      metric('Total reserve', usd(filtered().reduce(function(s,r){return s+(r.reserve||0);},0)));
    return;
  }
  var rows = filtered();
  var by = {Good:0,Great:0,Steal:0};
  rows.forEach(function(r){ if(by[r.tag]!=null) by[r.tag]++; });
  var ps = rows.map(function(r){return r.pct_below;}).filter(function(x){return x!=null;}).sort(function(a,b){return a-b;});
  var med = ps.length ? (ps.length%2 ? ps[(ps.length-1)/2] : (ps[ps.length/2-1]+ps[ps.length/2])/2) : null;
  var best = ps.length ? ps[ps.length-1] : null;

  el.innerHTML =
    metric('Lots shown', rows.length+' <small>of '+DEALS.length+'</small>')+
    '<div class="metric"><span class="k">By tier</span><span class="v tierdots">'+
      '<i class="s">'+by.Steal+'</i><i class="r">'+by.Great+'</i><i class="g">'+by.Good+'</i></span></div>'+
    metric('Median discount', med==null?'—':pct(med))+
    metric('Best discount', best==null?'—':pct(best));
}
function metric(k,v){ return '<div class="metric"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }

/* ---------- funnel ---------- */
function buildFunnel(){
  var f = P.funnel;
  var host = document.getElementById('funnelPanel');
  if(!f){ host.hidden = true; return; }
  var steps = [
    ['In file','total'],['After country','after_country'],['After dessert','after_dessert'],
    ['After price','after_price'],['After condition','after_condition'],
    ['Valued','valued'],['Unvalued','unvalued'],['Deals','deals']
  ].filter(function(s){ return f[s[1]]!=null; });
  var prev = null;
  document.getElementById('funnelBody').innerHTML = steps.map(function(s){
    var v = f[s[1]], drop = (prev!=null && v<prev && s[1]!=='unvalued' && s[1]!=='deals') ? ('−'+(prev-v)) : '';
    if(['total','after_country','after_dessert','after_price','after_condition'].indexOf(s[1])>=0) prev = v;
    return '<div class="fstep"><span class="k">'+s[0]+'</span><span class="v">'+v+'</span>'+
           (drop?'<span class="d">'+drop+'</span>':'')+'</div>';
  }).join('');
}

/* ---------- CSV ---------- */
function csv(){
  var cfg = VIEWS[state.view];
  var cols = cfg.cols.filter(function(c){ return c.csv!==false; });
  var head = cols.map(function(c){
    return c.k==='country' ? 'Country' : c.k==='wine_type' ? 'Type' : c.k==='pick' ? 'Personal pick' : c.label;
  }).concat(['Link']);
  function cell(r,c){
    if(c.k==='country') return r._country;
    if(c.k==='wine_type') return wtLabel(r.wine_type);
    if(c.k==='pick') return r.personal_pick ? (r.pick_reason||'Yes') : '';
    if(c.k==='pct_below') return r.pct_below==null?'':(Math.round(r.pct_below*1000)/10)+'%';
    if(c.k==='reserve') return r.reserve==null?'':r.reserve;
    if(c.k==='buyer_price') return r.buyer_price==null?'':r.buyer_price;
    if(c.k==='market') return r.market==null?'':r.market;
    if(c.k==='region') return lvl(r,1);
    if(c.k==='subregion') return lvl(r,2);
    if(c.k==='vintage') return r.vintage==null?'NV':r.vintage;
    if(c.k==='source') return r.source||'';
    return r[c.k]==null?'':r[c.k];
  }
  function q(s){ s = String(s==null?'':s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
  return [head.map(q).join(',')].concat(lastRows.map(function(r){
    return cols.map(function(c){ return q(cell(r,c)); }).concat([link(r.id)]).join(',');
  })).join('\r\n');
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('on'); },2600);
}
function copyCsv(){
  var text = csv();
  var done = function(){ toast('Copied '+lastRows.length+' rows as CSV'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ downloadCsv(text); });
  } else downloadCsv(text);
}
function downloadCsv(text){
  var blob = new Blob([text],{type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'winebid-'+(P.auction_date||'export')+'-'+state.view+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  toast('Clipboard blocked — downloaded the CSV instead');
}

/* ---------- render orchestration ---------- */
var railScroll = 0;
function render(opts){
  opts = opts||{};
  if(!opts.keepRail){
    railScroll = document.getElementById('rail').scrollTop;
    buildRail();
    document.getElementById('rail').scrollTop = railScroll;
  }
  buildChips(); buildSummary(); buildTable(); writeHash();
}

/* ---------- events ---------- */
document.getElementById('railBody').addEventListener('change', function(e){
  var t = e.target;
  if(t.dataset.facet){
    var k = t.dataset.facet, v = t.value, arr = state.sel[k], i = arr.indexOf(v);
    if(t.checked){ if(i<0) arr.push(v); } else if(i>=0) arr.splice(i,1);
    if(k==='country') state.sel.region = state.sel.region.filter(function(x){
      return VIEWS[state.view].rows.some(function(r){ return lvl(r,1)===x && (!state.sel.country.length || state.sel.country.indexOf(r.country_code)>=0); });
    });
    if(k==='country'||k==='region') state.sel.subregion = state.sel.subregion.filter(function(x){
      return VIEWS[state.view].rows.some(function(r){
        return lvl(r,2)===x &&
          (!state.sel.country.length || state.sel.country.indexOf(r.country_code)>=0) &&
          (!state.sel.region.length || state.sel.region.indexOf(lvl(r,1))>=0);
      });
    });
    render();
  } else if(t.id==='fStandouts'){ state.standouts = t.checked; render(); }
  else if(t.id==='fPicks'){ state.picks = t.checked; render(); }
});

document.getElementById('railBody').addEventListener('input', function(e){
  var t = e.target;
  if(!t.dataset.range) return;
  var k = t.dataset.range, b = bound(k), cur = rngOf(k).slice();
  var v = Number(t.value);
  if(t.dataset.side==='lo') cur[0] = Math.min(v, cur[1]);
  else cur[1] = Math.max(v, cur[0]);
  state.rng[k] = cur;
  /* update the visual track without rebuilding the rail (keeps the thumb grabbed) */
  var box = t.closest('.fgroup');
  var span = (b[1]-b[0])||1;
  box.querySelector('.fill').style.left = ((cur[0]-b[0])/span*100)+'%';
  box.querySelector('.fill').style.right = (100-(cur[1]-b[0])/span*100)+'%';
  var vals = box.querySelectorAll('.vals span');
  vals[0].textContent = RANGES[k].fmt(cur[0]); vals[1].textContent = RANGES[k].fmt(cur[1]);
  var hist = box.querySelectorAll('.hist span');
  if(hist.length){
    for(var i=0;i<hist.length;i++){
      var lo = b[0]+span*i/hist.length, hi = b[0]+span*(i+1)/hist.length;
      hist[i].classList.toggle('on', hi>=cur[0] && lo<=cur[1]);
    }
  }
  buildChips(); buildSummary(); buildTable(); writeHash();
});
document.getElementById('railBody').addEventListener('change', function(e){
  if(e.target.dataset.range) render();
});

document.getElementById('head').addEventListener('click', function(e){
  var th = e.target.closest('th'); if(!th || !th.dataset.col) return;
  var k = th.dataset.col;
  var col = VIEWS[state.view].cols.filter(function(c){return c.k===k;})[0];
  if(state.sort.col===k) state.sort.dir *= -1;
  else state.sort = {col:k, dir:(col.type==='text'?1:-1)};
  buildTable(); writeHash();
});

document.getElementById('mobileSort').addEventListener('change', function(e){
  var parts = e.target.value.split(':');
  state.sort = {col:parts[0], dir:Number(parts[1])};
  buildTable(); writeHash();
});

document.getElementById('chips').addEventListener('click', function(e){
  var b = e.target.closest('button[data-chip]'); if(!b) return;
  var kind = b.dataset.chip, arg = b.dataset.arg;
  if(kind==='q'){ state.q=''; document.getElementById('q').value=''; }
  else if(kind==='facet'){ var p = arg.split('|'); var k=p[0], v=p.slice(1).join('|');
    state.sel[k] = state.sel[k].filter(function(x){return x!==v;}); }
  else if(kind==='range') delete state.rng[arg];
  else if(kind==='standouts') state.standouts=false;
  else if(kind==='picks') state.picks=false;
  render();
});

var qt;
document.getElementById('q').addEventListener('input', function(e){
  clearTimeout(qt); var v = e.target.value;
  qt = setTimeout(function(){ state.q = v; render(); },140);
});

Array.prototype.forEach.call(document.querySelectorAll('.views button'), function(btn){
  btn.addEventListener('click', function(){
    if(state.view===btn.dataset.view) return;
    state.view = btn.dataset.view;
    Array.prototype.forEach.call(document.querySelectorAll('.views button'), function(b){
      b.setAttribute('aria-selected', String(b===btn));
    });
    state.sort = Object.assign({}, VIEWS[state.view].defaultSort);
    render();
  });
});

function clearAll(){
  Object.keys(state.sel).forEach(function(k){ state.sel[k] = []; });
  state.rng = {}; state.q = ''; state.standouts = false; state.picks = false;
  document.getElementById('q').value = '';
  render();
}
document.getElementById('btnClear').addEventListener('click', clearAll);
document.getElementById('btnClear2').addEventListener('click', clearAll);
document.getElementById('btnCsv').addEventListener('click', copyCsv);

/* Two buttons open the same filter rail: #railToggle lives in the masthead
   (tablet width) and #railToggleMobile sits above the results list (phone
   width, see template CSS) -- a search-results-page placement rather than a
   header button. Both drive the same .rail.open toggle.

   On phone width the CSS turns .rail into a bottom-sheet tray instead of an
   inline block (see template.html's @media max-width:640px), so opening it
   also needs a backdrop and a scroll lock. Those are harmless no-ops at
   tablet/desktop width -- .railBackdrop stays display:none there via CSS,
   and locking body scroll while an *inline* rail is open would be wrong, so
   the lock only takes effect under the same 640px query (body.no-scroll is
   inert outside it). setRail() is the one place that changes the open
   state; everything else (buttons, backdrop, Escape) calls into it. */
function setRail(on){
  document.getElementById('rail').classList.toggle('open', on);
  document.getElementById('railBackdrop').classList.toggle('open', on);
  document.body.classList.toggle('no-scroll', on);
  document.querySelectorAll('.railToggleBtn').forEach(function(b){
    b.setAttribute('aria-pressed', String(on));
  });
}
function toggleRail(){
  setRail(!document.getElementById('rail').classList.contains('open'));
}
Array.prototype.forEach.call(document.querySelectorAll('.railToggleBtn'), function(btn){
  btn.addEventListener('click', toggleRail);
});
document.getElementById('railClose').addEventListener('click', function(){ setRail(false); });
document.getElementById('railBackdrop').addEventListener('click', function(){ setRail(false); });
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && document.getElementById('rail').classList.contains('open')) setRail(false);
});

/* ---------- boot ---------- */
computeBounds();
readHash();
document.getElementById('auctionLabel').textContent =
  (P.auction_date ? 'Auction ending '+P.auction_date : '') + (P.sample ? ' · sample' : '');
document.title = 'WineBid Scout'+(P.auction_date?' — '+P.auction_date:'');
if(P.sample) document.getElementById('sampleBanner').hidden = false;
document.getElementById('q').value = state.q;
Array.prototype.forEach.call(document.querySelectorAll('.views button'), function(b){
  b.setAttribute('aria-selected', String(b.dataset.view===state.view));
});
if(!VIEWS[state.view].cols.some(function(c){return c.k===state.sort.col;}))
  state.sort = Object.assign({}, VIEWS[state.view].defaultSort);
buildFunnel();
render();
})();

</script>
